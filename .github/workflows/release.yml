name: Build & Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Generate the Android project
        run: npx cap add android

      - name: Sync web assets into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: npx electron-builder --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    name: Build Linux app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build desktop app
        run: npx electron-builder --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [apk, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List release files
        run: ls -la release

      - name: Create/update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Live in City — latest build
          body: |
            Automated build from the `main` branch.

            - 📱 `app-debug.apk` — Android (install directly on your phone, allow unknown apps)
            - 🪟 `Live-in-City-*-win-*.exe` — Windows installer / portable
            - 🐧 `Live-in-City-*-linux-*.AppImage` — Linux (`chmod +x` then run)

            Trigger a fresh build anytime: **Actions → Build & Release → Run workflow**.
          files: release/*
          fail_on_unmatched_files: false
