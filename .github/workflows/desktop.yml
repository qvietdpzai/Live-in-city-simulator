name: Build Desktop Apps (Windows + Linux)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      # Windows targets are cross-built with Wine (preinstalled on
      # ubuntu-latest runners); Linux gets an AppImage.
      - name: Build desktop apps
        run: npx electron-builder --publish never --win nsis portable --linux AppImage

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Live-in-City-Desktop
          path: |
            dist/*.exe
            dist/*.AppImage
          if-no-files-found: error
